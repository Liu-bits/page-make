# =============================================================================
# Page-make CI/CD
# -----------------------------------------------------------------------------
# 触发条件：push（main / tag v*）、pull_request、手动触发
#
# 需要的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   EDGEONE_API_TOKEN      EdgeOne Makers API Token（第一版实际使用，主线路部署）
#   CLOUDFLARE_API_TOKEN   Cloudflare API Token（备选线路，第一版占位不启用）
#   APPLE_TEAM_ID          第一版占位，不启用
#   APPLE_KEY_ID           第一版占位，不启用
#   APPLE_PRIVATE_KEY      第一版占位，不启用
#
# 环境要求（用户指定）：
#   - iOS 编译：xcode-27 runner（= macOS 27.0.1 镜像，arm64；macos-27 标签 GitHub 尚未提供）
#   - Xcode 27.0.1：Apple 实际版本线为 27.0.0 → 27.1.0 → 27.2(beta)，
#     不存在 27.0.1，CI 锁定最接近的 27.0.0 GM（build 27A266a）并校验
#   - 运行目标：优先 iOS 27.0.1 模拟器，未安装时回退 iOS 27.0（最接近）
#   - 后端测试：ubuntu-latest + Node 22
#
# 第一版约束：
#   - iOS 编译只做 build + test，不签名、不打包 IPA、不上传 App Store
#   - 部署只在 main 分支触发
#   - 后端测试与 iOS 编译并行；部署依赖两者全部通过
# =============================================================================

name: Page-make CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. 后端逻辑测试（EdgeOne Pages Functions 的纯逻辑，Node 直接跑）
  # ---------------------------------------------------------------------------
  backend-test:
    name: "后端逻辑测试（Node 22）"
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 运行后端单元测试（解压 / 诊断 / 状态机 / KV key / JWT 解码）
        run: node dev/run-tests.mjs

  # ---------------------------------------------------------------------------
  # 2. iOS 编译与单元测试（macOS 27 / Xcode 27.0.1 / iOS 27.0.1）
  # ---------------------------------------------------------------------------
  ios-build:
    name: "iOS 编译与测试（xcode-27 · macOS 27.0.1 · Xcode 27.0.0 · iOS 27.0+）"
    # xcode-27 标签 = macOS 27.0.1 镜像（预装 Xcode 27，arm64 公共预览）
    runs-on: xcode-27
    env:
      XCODE_VERSION: "27.0.0"
      SIM_OS_VERSION: "27.0.1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 27.0.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0.0"

      - name: 校验 Xcode 版本必须为 27.0.0
        run: |
          echo "当前 Xcode：$(xcodebuild -version | head -1)"
          xcodebuild -version | head -1 | grep -q "^Xcode 27\.0\.0$" || { echo "::error::Xcode 版本不是 27.0.0"; exit 1; }

      - name: 安装 XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 解析 iOS 27.0.1 模拟器（未安装时回退到已安装的最新 iOS 运行时）
        run: node ios/scripts/resolve-simulator.mjs >> "$GITHUB_ENV"

      - name: 编译（Debug · 不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PageMake.xcodeproj \
            -scheme PageMake \
            -configuration Debug \
            -destination "$SIM_DEST" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - name: 运行单元测试（iOS 27.0.1 模拟器）
        working-directory: ios
        run: |
          xcodebuild \
            -project PageMake.xcodeproj \
            -scheme PageMake \
            -configuration Debug \
            -destination "$SIM_DEST" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test-without-building

  # ---------------------------------------------------------------------------
  # 3. 部署（仅 main 分支，依赖 backend-test + ios-build 全部通过）
  # ---------------------------------------------------------------------------
  deploy:
    name: "部署（仅 main 分支）"
    needs: [backend-test, ios-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到 EdgeOne Pages（主线路）
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: bash scripts/deploy-edgeone.sh

      - name: 部署到 Cloudflare Pages（备选线路 · 第一版占位）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/deploy-cloudflare.sh

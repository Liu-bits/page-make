# Page-make 主分支（main）—— 只做部署
#
# 分工：
#   debug 分支：跑全部测试、iOS 编译、IPA 构建（.github/workflows/debug.yaml）
#   main  分支：只把已通过的代码部署到 ModelScope 创空间
#
# 规则（必须遵守）：
#   - 不允许直接向 main 推代码，只允许从 debug 合并（见 AGENTS.md §0）
#   - 合并前 debug 上 backend-test / ios-build / ipa 三个 job 必须全绿
#
# 需要的 GitHub 配置：
#   Variables: MODELSCOPE_SPACE   创空间标识（格式 用户名/空间名）
#   Secrets:   MODELSCOPE_TOKEN   ModelScope API Token
#   （未配置时部署脚本自动跳过，不报错）

name: Page-make 部署（main）

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: "部署到 ModelScope 创空间"
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 推送构建子集到创空间（平台自动构建）
        env:
          MODELSCOPE_SPACE: ${{ vars.MODELSCOPE_SPACE }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: bash scripts/deploy-modelscope.sh

# =============================================================================
# JWKS 种子每日刷新（Google / Apple 登录验签公钥）
# -----------------------------------------------------------------------------
# 背景：自托管容器在境内网络无法访问 googleapis.com，登录验签依赖内置种子
#       （backend/data/*-jwks.json）。Google / Apple 会轮换签名密钥，本 workflow
#       每日从官方 JWKS 地址拉取并自动提交，保证种子不过期。
#
# 推送到哪里：**两个分支都要**
#       ① 先提交到 debug（验证分支，唯一例外允许机器人直接提交的种子数据）；
#       ② 再把 backend/data/ 两个文件同步到 main，让生产镜像拿到新种子。
#       注意第二步只搬种子文件、**不 merge debug**：debug 上可能压着尚未验证的代码，
#       整分支合并会把它们直接推上线（main 的 push 会立刻触发生产部署且不跑测试）。
#
# 检出必须是 debug（2026-11-19 修复）：此前 checkout 默认落在 main、却 push 到 debug，
#       一旦 debug 上已有种子提交，后续 rebase 必然在 backend/data/*.json 上冲突 →
#       定时任务从 11-17 起连续 Failed。检出与推送目标现在一致。
#
# 提交频率：scripts/refresh-jwks.mjs 只在公钥集合真的变化时才写文件，所以
#       “没有轮换的日子”这里会直接走「种子无变化」退出，不会天天产生提交。
#
# 手动触发：Actions → JWKS 种子刷新 → Run workflow
# =============================================================================

name: JWKS 种子刷新

on:
  schedule:
    - cron: "37 18 * * *" # 每日 02:37（北京时间）
  workflow_dispatch:

permissions:
  contents: write

# 同一时刻只允许一个刷新任务，避免两次提交互相踩（手动触发撞上定时任务）
concurrency:
  group: jwks-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: 刷新 JWKS 种子
    runs-on: ubuntu-latest
    steps:
      - name: 检出 debug
        uses: actions/checkout@v4
        with:
          # 必须显式检出 debug：默认是默认分支 main，与下方推送目标不一致
          ref: debug
          fetch-depth: 0

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 部分源失败时不阻断：任一源写盘成功都值得提交上线，
      # 失败的那一侧保留旧种子（step 会被标成失败，UI 上仍可见）
      - name: 刷新种子（失败保留旧种子）
        continue-on-error: true
        run: node scripts/refresh-jwks.mjs

      # 第一步：先落到 debug（开发/验证分支）
      - name: 提交推送到 debug
        run: |
          if git diff --quiet -- backend/data/; then
            echo "种子无变化，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/
          git commit -m "chore: 刷新 JWKS 种子（自动）"

          for attempt in 1 2 3; do
            if git push origin HEAD:debug; then
              echo "✓ 种子已推送到 debug"
              exit 0
            fi
            echo "::warning::第 ${attempt} 次推送失败，同步 origin/debug 后重试"
            sleep 5
            git fetch origin debug
            # 只有 debug 真的前进了（非快进）才需要重放；否则多半是权限/网络问题
            if ! git merge-base --is-ancestor origin/debug HEAD; then
              echo "debug 分支已前进，把种子提交重放到最新 debug 上"
              if ! git rebase origin/debug; then
                echo "::error::种子提交与 debug 冲突，需人工处理（git rebase --abort 后手动提交）"
                exit 1
              fi
            fi
          done
          echo "::error::连续 3 次推送失败，请检查 debug 分支保护或并发推送"
          exit 1

      # 第二步：再同步到 main（生产分支）
      # 只从 debug 搬 backend/data/ 两个种子文件，**不 merge debug**——
      # debug 上可能还有未验证的代码提交，整分支合并等于把它们直接推上线。
      # 不加 `if:` 门控：即使第一步没提交（例如上次 main 推送失败后 debug 已是最新），
      # 这里也要跑一遍把 main 补齐，否则 main 的种子会一直旧到下次轮换。
      - name: 同步种子到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main debug
            git checkout -B main origin/main
            git checkout origin/debug -- backend/data/google-jwks.json backend/data/apple-jwks.json
            if git diff --cached --quiet; then
              echo "main 已是最新种子，无需提交"
              exit 0
            fi
            git commit -m "chore: 刷新 JWKS 种子（自动）"
            if git push origin HEAD:main; then
              echo "✓ 种子已同步到 main（触发一次生产部署，属于本任务的预期行为）"
              exit 0
            fi
            echo "::warning::第 ${attempt} 次推送 main 失败，重试"
            sleep 5
          done
          echo "::error::连续 3 次推送 main 失败，请检查分支保护设置"
          exit 1
